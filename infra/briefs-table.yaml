AWSTemplateFormatVersion: "2010-09-09"
Description: DynamoDB table for background research briefs, plus a least-privilege policy for the app.

Parameters:
  TableName:
    Type: String
    Default: dental-research-briefs

Resources:
  BriefsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  BriefsAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read and write research briefs only
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: !GetAtt BriefsTable.Arn

Outputs:
  TableName:
    Value: !Ref BriefsTable
  PolicyArn:
    Value: !Ref BriefsAccessPolicy
